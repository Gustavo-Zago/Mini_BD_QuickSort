<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini BD — Busca Binary</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header>
    <h1>Mini BD — Busca Binária</h1>
    <p>10 milhões de registros · índice QuickSort · busca em O(log n)</p>
    <div id="status-bar">
      <div class="dot" id="dot"></div>
      <span id="status-txt">Conectando ao servidor...</span>
    </div>
  </header>

  <div class="card">
    <div class="search-row">
      <input id="input-busca" type="text" placeholder="Digite nome ou endereço para pesquisar..." autocomplete="off"
        spellcheck="false" />
      <div class="controls">
        <select id="sel-campo" title="Campo de busca">
          <option value="nome">Nome</option>
          <option value="endereco">Endereço</option>
        </select>
        <select id="sel-tipo" title="Tipo de busca">
          <option value="parcial">Prefixo</option>
          <option value="exata">Exata</option>
        </select>
        <button id="btn-buscar">Buscar</button>
      </div>
    </div>

    <div id="meta"></div>
    <div id="tabela-wrap"></div>
  </div>

  <script src="app.js"></script>
</body>

</html>
